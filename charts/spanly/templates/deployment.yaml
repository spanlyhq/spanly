apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spanly.fullname" . }}
  labels: {{- include "spanly.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "spanly.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spanly.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spanly
          image: {{ include "spanly.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - proxy
            - "--inspect-prefix={{ .Values.proxy.inspectPrefix }}"
            - "--buffer-size={{ .Values.buffer.size }}"
            - "--retry-max-attempts={{ .Values.buffer.retryMaxAttempts }}"
            - "--retry-backoff={{ .Values.buffer.retryBackoff }}"
            - "--retry-max-backoff={{ .Values.buffer.retryMaxBackoff }}"
            - "--shutdown-grace={{ .Values.shutdownGrace }}"
            {{- if .Values.admin.enabled }}
            - "--admin-addr=:{{ .Values.admin.port }}"
            {{- end }}
            {{- range .Values.proxy.contextHeaders }}
            - "--context-header={{ . }}"
            {{- end }}
            - "{{ required "proxy.upstream is required" .Values.proxy.upstream }}"
            - ":{{ .Values.service.port }}"
          env:
            - name: SPANLY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.secretName | quote }}
                  key: {{ .Values.apiKey.secretKey | quote }}
            {{- if .Values.ingestURL }}
            - name: SPANLY_INGEST_URL
              value: {{ .Values.ingestURL | quote }}
            {{- end }}
          ports:
            - name: proxy
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.admin.enabled }}
            - name: admin
              containerPort: {{ .Values.admin.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.admin.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
