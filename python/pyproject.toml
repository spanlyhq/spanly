[project]
name = "spanly"
version = "0.1.1"
description = "Spanly Python SDK: observability for MCP servers and AI agents. Captures tool calls, prompts, resources, and JSON-RPC traffic."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "observability", "monitoring", "telemetry", "ai", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://spanly.com"
Documentation = "https://spanly.com/docs/python-sdk/"
Repository = "https://github.com/spanlyhq/spanly"
Issues = "https://github.com/spanlyhq/spanly/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
