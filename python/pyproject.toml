[project]
name = "spanly"
version = "0.1.1"
description = "Spanly SDK for monitoring MCP servers"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://spanly.com"
Repository = "https://github.com/spanlyhq/spanly"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
