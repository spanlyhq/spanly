version: 2

project_name: spanly

# VERSION env var must be set by the caller (clean semver, e.g. "0.1.2").
# Set by .github/workflows/release-cli.yml; for local snapshot builds:
#   VERSION=0.0.0-dev GORELEASER_CURRENT_TAG=cli-v0.0.0-dev \
#     goreleaser release --snapshot --clean
#
# The tag itself (e.g. cli-v0.1.2) is not valid semver, so we can't rely
# on .Version — GoReleaser's OSS monorepo support would handle this, but
# it's a Pro-only feature. The clean VERSION env var is threaded through
# ldflags and archive name_template. The Homebrew formula's own `version`
# field (generated by GoReleaser from .Version) ends up as the prefixed
# tag; cosmetic only — functionality is unaffected.

builds:
  - id: spanly
    main: ./
    binary: spanly
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Env.VERSION }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: spanly
    name_template: "spanly_{{ .Env.VERSION }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "spanly/spanly:{{ .Env.VERSION }}-amd64"
      - "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}-amd64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=spanly"
      - "--label=org.opencontainers.image.source=https://github.com/spanlyhq/spanly"
      - "--label=org.opencontainers.image.version={{ .Env.VERSION }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - image_templates:
      - "spanly/spanly:{{ .Env.VERSION }}-arm64"
      - "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}-arm64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=spanly"
      - "--label=org.opencontainers.image.source=https://github.com/spanlyhq/spanly"
      - "--label=org.opencontainers.image.version={{ .Env.VERSION }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "spanly/spanly:{{ .Env.VERSION }}"
    image_templates:
      - "spanly/spanly:{{ .Env.VERSION }}-amd64"
      - "spanly/spanly:{{ .Env.VERSION }}-arm64"
  - name_template: "spanly/spanly:latest"
    image_templates:
      - "spanly/spanly:{{ .Env.VERSION }}-amd64"
      - "spanly/spanly:{{ .Env.VERSION }}-arm64"
  - name_template: "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}"
    image_templates:
      - "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}-amd64"
      - "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}-arm64"
  - name_template: "ghcr.io/spanlyhq/spanly:latest"
    image_templates:
      - "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}-amd64"
      - "ghcr.io/spanlyhq/spanly:{{ .Env.VERSION }}-arm64"

brews:
  - name: spanly
    repository:
      owner: spanly
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://spanly.dev"
    description: "Spanly CLI — observability for MCP servers (run + proxy modes)"
    install: |
      bin.install "spanly"
    test: |
      system "#{bin}/spanly", "-h"
    skip_upload: auto

release:
  github:
    owner: spanlyhq
    name: spanly
  prerelease: auto
